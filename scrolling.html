<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrolling Results Presentation | Hamilton County Election Commission</title>

  <!-- Global Visual Diagnostic Error Handler -->
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var d = document.createElement('div');
      d.style.cssText = 'background:#fef2f2; border:2px solid #dc2626; color:#991b1b; padding:20px; margin:20px; font-family:sans-serif; font-size:14px; border-radius:8px; z-index:9999; position:relative;';
      d.innerHTML = '<h3>&#x26A0;&#xFE0F; JavaScript Runtime Error:</h3>' +
                    '<p><strong>Message:</strong> ' + msg + '</p>' +
                    '<p><strong>Source:</strong> ' + src + ' (Line ' + line + ', Col ' + col + ')</p>';
      document.body.insertBefore(d, document.body.firstChild);
      return false;
    };
  </script>

  <!-- CSS Design System -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="scrolling-body">

  <!-- Screen Reader Skip Link (WCAG 2.1 AA SC 1.3.2) -->
  <a href="#main-content" class="sr-only">Skip to main content</a>

  <!-- Top Navigation Bar -->
  <nav class="navbar" role="navigation" aria-label="Main Navigation">
    <a href="index.html" class="navbar-brand" aria-label="Hamilton County Election Commission Home">
      <div class="navbar-seal" aria-hidden="true">
        <svg class="tn-seal-svg" viewBox="0 0 100 100" width="100%" height="100%" aria-label="Tennessee Three Grand Divisions Logo">
          <circle cx="50" cy="50" r="50" fill="#CC0000" />
          <circle cx="50" cy="50" r="43" fill="none" stroke="#FFFFFF" stroke-width="4" />
          <circle cx="50" cy="50" r="41" fill="#002147" />
          <g fill="#FFFFFF">
            <path d="M 0,-9 L 2.65,-2.78 L 8.56,-2.78 L 3.83,0.66 L 5.63,6.36 L 0,2.7 L -5.63,6.36 L -3.83,0.66 L -8.56,-2.78 L -2.65,-2.78 Z" transform="translate(37, 39) rotate(-10)" />
            <path d="M 0,-9 L 2.65,-2.78 L 8.56,-2.78 L 3.83,0.66 L 5.63,6.36 L 0,2.7 L -5.63,6.36 L -3.83,0.66 L -8.56,-2.78 L -2.65,-2.78 Z" transform="translate(63, 43) rotate(25)" />
            <path d="M 0,-9 L 2.65,-2.78 L 8.56,-2.78 L 3.83,0.66 L 5.63,6.36 L 0,2.7 L -5.63,6.36 L -3.83,0.66 L -8.56,-2.78 L -2.65,-2.78 Z" transform="translate(48, 66) rotate(60)" />
          </g>
        </svg>
      </div>
      <div>
        <div class="navbar-title">Hamilton County Election Commission</div>
        <div id="navbar-subtitle" class="navbar-subtitle">Election Night Live Projector Results</div>
      </div>
    </a>

    <div class="navbar-controls">
      <a href="index.html" class="nav-btn">Summary Results</a>
      <a href="reporting.html" class="nav-btn">Reporting Status</a>
      <a href="precincts.html" class="nav-btn">Precinct Results</a>
      <a href="scrolling.html" class="nav-btn active" aria-current="page">&#x1F4FA; Scrolling Results</a>
      <button type="button" class="nav-btn" onclick="ElectionApp.refreshResults()" aria-label="Refresh Election Results">
        &#x21BB; Refresh
      </button>
      <button type="button" id="dark-mode-toggle" class="nav-btn" onclick="ElectionApp.toggleDarkMode()" aria-label="Toggle Dark Mode Theme">
        &#x1F319; Dark Mode
      </button>
      <button type="button" id="contrast-toggle" class="nav-btn" onclick="ElectionApp.toggleHighContrast()" aria-label="Toggle High Contrast Mode">
        &#x1F317; High Contrast
      </button>
    </div>
  </nav>

  <!-- Projector Presentation Container -->
  <main id="main-content" class="scrolling-main">

    <!-- Slide Timer Progress Bar -->
    <div class="slide-timer-container">
      <div id="slide-timer-bar" class="slide-timer-bar"></div>
    </div>

    <!-- Live Overall Summary Header Ticker -->
    <header class="scrolling-ticker">
      <div class="ticker-header-top">
        <span id="ticker-status" class="live-badge">&#x25CF; UNOFFICIAL RESULTS</span>
        <span id="ticker-date" class="ticker-date-title">--</span>
      </div>

      <div class="ticker-header-grid">
        <div class="ticker-chip">
          <span class="ticker-label">Voters:</span>
          <span id="ticker-voters" class="ticker-value">--</span>
        </div>
        <div class="ticker-chip">
          <span class="ticker-label">Ballots Cast:</span>
          <span id="ticker-ballots" class="ticker-value">--</span>
        </div>
        <div class="ticker-chip">
          <span class="ticker-label">Turnout:</span>
          <span id="ticker-turnout" class="ticker-value">--%</span>
        </div>
        <div class="ticker-chip">
          <span class="ticker-label">Early / Absentee:</span>
          <span id="ticker-early" class="ticker-value">--</span>
        </div>
        <div class="ticker-chip">
          <span class="ticker-label">ED Precincts:</span>
          <span id="ticker-reporting" class="ticker-value">--</span>
        </div>
      </div>
    </header>

    <!-- Slide Display Viewport -->
    <section id="slide-viewport" class="slide-viewport" aria-live="polite">
      <!-- Dynamically rendered slide content -->
    </section>

    <!-- Floating Projector Operator Controls Bar -->
    <footer class="projector-controls" role="toolbar" aria-label="Slideshow Controls">
      <div class="control-group">
        <button type="button" id="btn-prev" class="proj-btn" onclick="ElectionApp.prevSlide()" aria-label="Previous Slide">
          &#x23EE;&#xFE0F; Prev
        </button>
        <button type="button" id="btn-playpause" class="proj-btn active" onclick="ElectionApp.togglePause()" aria-label="Pause Slideshow">
          &#x23F8;&#xFE0F; Pause
        </button>
        <button type="button" id="btn-next" class="proj-btn" onclick="ElectionApp.nextSlide()" aria-label="Next Slide">
          Next &#x23ED;&#xFE0F;
        </button>
      </div>

      <div class="control-group">
        <label for="speed-select" class="proj-label">&#x23F1;&#xFE0F; Speed:</label>
        <select id="speed-select" class="proj-select" onchange="ElectionApp.setSlideSpeed(this.value)" aria-label="Slideshow Interval Speed">
          <option value="5000">5s</option>
          <option value="8000" selected>8s (Default)</option>
          <option value="12000">12s</option>
          <option value="15000">15s</option>
        </select>

        <select id="slide-jump-menu" class="proj-select" onchange="ElectionApp.jumpToSlide(this.value)" aria-label="Jump to specific slide">
          <!-- Dynamically populated slide options -->
        </select>

        <button type="button" id="btn-fullscreen" class="proj-btn" onclick="ElectionApp.toggleFullscreen()" aria-label="Toggle Presentation Fullscreen">
          &#x26F6;&#xFE0F; Fullscreen
        </button>
      </div>
    </footer>

  </main>

  <!-- Election Data & Application Controller Scripts -->
  <script src="./data.js" defer></script>
  <script src="app.js" defer></script>
  <script>
    // Initialize Slideshow Engine on DOM Load
    document.addEventListener('DOMContentLoaded', function() {
      if (window.ElectionApp && window.ElectionApp.initSlideshow) {
        window.ElectionApp.initSlideshow();
      }
    });
  </script>
</body>
</html>
