name: deploy-target

# One deploy target (called by deploy.yml): staging or production. The job runs in the named GitHub
# environment, so production waits for its required reviewers before any step runs.
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      project: { type: string, required: true }
      bucket: { type: string, required: true }
      service_account_var: { type: string, required: true }
      smoke: { type: boolean, default: true }
      test_election: { type: boolean, default: false } # staging only; ignored for production

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install function dependencies
        working-directory: functions
        run: npm ci --omit=dev

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars[inputs.service_account_var] }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Public bucket settings (CORS, drafts lifecycle)
        run: |
          gcloud storage buckets update "gs://${{ inputs.bucket }}" --cors-file=cors.json --project="${{ inputs.project }}"
          gcloud storage buckets update "gs://${{ inputs.bucket }}" --lifecycle-file=lifecycle.json --project="${{ inputs.project }}"

      - name: Deploy functions and rules
        run: npx --yes firebase-tools@13.35.1 deploy --only functions,firestore:rules,storage --project "${{ inputs.project }}" --non-interactive --force

      - name: Public invoker on the callables (the org policy blocks it by default)
        # Callables check sign-in and admins/{uid} themselves; the scheduled auditLive is never made public.
        run: |
          for fn in $(grep -oP '^exports\.\K\w+(?= = (adminCall|onCall)\()' functions/src/index.js); do
            service=$(echo "$fn" | tr '[:upper:]' '[:lower:]')
            gcloud run services add-iam-policy-binding "$service" --region=us-east1 \
              --member=allUsers --role=roles/run.invoker --project="${{ inputs.project }}" --quiet >/dev/null
            echo "invoker: $service"
          done

      # The smoke, load and ZAP steps need something published. On staging this publishes the sample
      # test election through the callables just deployed (it replaces the staging bucket's current/ files).
      - name: Function dev dependencies (the firebase client SDK) for the test election
        if: ${{ inputs.test_election && inputs.environment == 'staging' }}
        working-directory: functions
        run: npm ci
      - name: Publish the staging test election (Web Results Samples 00→06)
        if: ${{ inputs.test_election && inputs.environment == 'staging' }}
        run: node tools/staging-election.js --project "${{ inputs.project }}"

      - name: Smoke test of what the public is served
        if: ${{ inputs.smoke }}
        run: node tools/smoke-public.js "${{ inputs.bucket }}" --origin https://govotehamiltontn.gov

      # Layers 13-14 on staging only (plan: Environments and CI). Both need something published, like the smoke test.
      - name: Load test of the manifest poll (p95 under 300 ms, no errors)
        if: ${{ inputs.smoke && inputs.environment == 'staging' }}
        run: node tools/load-manifest.js "https://storage.googleapis.com/${{ inputs.bucket }}/current/manifest.json" --requests 2000 --concurrency 200 --max-p95 300

  zap:
    # Third-party scanner in its own job: no id-token, no GCP credentials file in the workspace.
    needs: deploy
    if: ${{ inputs.environment == 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Passive scans only (spider + passive rules, no attacks). Warnings are reported, not failed: GitHub
      # Pages' headers can't be changed. Rules marked FAIL in .zap/rules.tsv fail the run.
      - name: ZAP baseline of the public pages
        if: ${{ inputs.environment == 'staging' }}
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://govotehamiltontn.gov/Results/
          rules_file_name: .zap/rules.tsv
          cmd_options: '-I'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-pages
      - name: ZAP baseline of the staging bucket
        if: ${{ inputs.smoke && inputs.environment == 'staging' }}
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://storage.googleapis.com/${{ inputs.bucket }}/current/manifest.json
          rules_file_name: .zap/rules.tsv
          cmd_options: '-I'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-bucket
