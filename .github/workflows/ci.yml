name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Goldens are up to date with the Python reference
        run: |
          npm run golden
          git diff --exit-code --stat -- test/golden
      - name: Tests with coverage gates
        run: npm run test:pr
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: functions/coverage
          if-no-files-found: ignore

  emulator:
    # Layers 6-7: security rules and the callables on the Firebase emulators.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Rules + callables on the emulators
        run: npm run test:emulator
      - name: Admin and review pages, signed in (axe on the emulators)
        working-directory: .
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run a11y:admin

  pages:
    # Layers 10 and 12: axe (WCAG 2.1 AA) and live-update tests on the public pages.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: HTML validity (npm run lint:html)
        run: npm run lint:html
      - run: npx playwright install --with-deps chromium
      - name: Accessibility and live updates (npm run a11y)
        run: npm run a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (high+)
        working-directory: functions
        run: npm audit --audit-level=high
      - name: npm audit, page tooling (high+)
        run: npm audit --audit-level=high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          # functions and the page tooling; perf/ (local Lighthouse runner, not shipped) is left out on purpose.
          scan-args: --lockfile=functions/package-lock.json --lockfile=package-lock.json
