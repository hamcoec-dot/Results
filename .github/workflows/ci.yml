name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR branch cancels the older run; pushes to main always run in full.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Goldens are up to date with the Python reference
        run: |
          npm run golden
          git diff --exit-code --stat -- test/golden
      - name: Tests with coverage gates
        run: npm run test:pr
        env:
          PYTHON: python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: functions/coverage
          if-no-files-found: ignore

  emulator:
    # Layers 6-7: security rules and the callables on the Firebase emulators.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Rules + callables on the emulators
        run: npm run test:emulator
      - name: Admin and review pages, signed in (axe on the emulators)
        working-directory: .
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
          npm run a11y:admin
      - name: Admin flows in Firefox (on fresh emulators)
        working-directory: .
        run: npm run a11y:admin:firefox
      - name: Automated rehearsal on the emulators, every page checked against the CSVs, then cleared
        working-directory: .
        run: >-
          npx --yes firebase-tools@13.35.1 emulators:exec --project demo-hcec --only auth,firestore,storage,functions
          "node tools/staging-election.js --emulator --election test-rehearsal --rehearsal --check-pages
          && node tools/clear-test-election.js test-rehearsal --emulator --remove-bot --yes"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-admin-results
          path: test-results
          if-no-files-found: ignore

  pages:
    # Layers 10 and 12: axe (WCAG 2.1 AA) and live-update tests on the public pages.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: HTML validity (npm run lint:html)
        run: npm run lint:html
      - name: Script and stylesheet ?v= versions match the files (node tools/asset-versions.js)
        run: npm run assets:check
      - run: npx playwright install --with-deps chromium
      - name: Accessibility and live updates (npm run a11y)
        run: npm run a11y
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore

  browsers:
    # Layer 8 on the other profiles: the behaviour tests (DOM oracle, features, live updates,
    # resilience, hostile names) in Firefox, WebKit, and on emulated Pixel 7 and iPhone 14.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Behaviour tests in other browsers (npm run e2e:browsers)
        run: npm run e2e:browsers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-browsers-results
          path: test-results
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: npm audit (high+)
        working-directory: functions
        run: npm audit --audit-level=high
      - name: npm audit, page tooling (high+)
        run: npm audit --audit-level=high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@e69cc6c86b31f1e7e23935bbe7031b50e51082de # v2.0.2
        with:
          # functions and the page tooling; perf/ (local Lighthouse runner, not shipped) is left out on purpose.
          scan-args: --lockfile=functions/package-lock.json --lockfile=package-lock.json
